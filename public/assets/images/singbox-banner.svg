      <stop offset="0.55" stop-color="#10345a"/>
      <stop offset="1" stop-color="#0a7c80"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e6d3"/>
      <stop offset="1" stop-color="#87b7ff"/>
